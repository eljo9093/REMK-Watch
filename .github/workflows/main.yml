name: Android & Wear OS APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Smartphone- und Wear-OS-APK bauen
        run: |
          if [ -f "Android_Studio_Kotlin_App/settings.gradle.kts" ]; then
            cd Android_Studio_Kotlin_App
          fi
          gradle :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Smartphone-APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Coaching-Phone-APK
          path: "**/app/build/outputs/apk/debug/*.apk"

      - name: Wear-OS-APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Coaching-Wear-APK
          path: "**/wear/build/outputs/apk/debug/*.apk"
