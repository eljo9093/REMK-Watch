name: Android APK Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Fehlende Icon-Dateien aus bestehendem Drawable kopieren
        run: |
          if [ -d Android_Studio_Kotlin_App ]; then
            cd Android_Studio_Kotlin_App
          fi
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap
          mkdir -p wear/src/main/res/drawable
          mkdir -p wear/src/main/res/mipmap
          cp app/src/main/res/drawable/remk_widget_bg.xml app/src/main/res/drawable/ic_launcher.xml
          cp app/src/main/res/drawable/remk_widget_bg.xml app/src/main/res/drawable/ic_launcher_round.xml
          cp app/src/main/res/drawable/remk_widget_bg.xml app/src/main/res/mipmap/ic_launcher.xml
          cp app/src/main/res/drawable/remk_widget_bg.xml app/src/main/res/mipmap/ic_launcher_round.xml
          cp app/src/main/res/drawable/remk_widget_bg.xml wear/src/main/res/drawable/ic_launcher.xml
          cp app/src/main/res/drawable/remk_widget_bg.xml wear/src/main/res/drawable/ic_launcher_round.xml
          cp app/src/main/res/drawable/remk_widget_bg.xml wear/src/main/res/mipmap/ic_launcher.xml
          cp app/src/main/res/drawable/remk_widget_bg.xml wear/src/main/res/mipmap/ic_launcher_round.xml

      - name: APKs bauen
        run: |
          if [ -d Android_Studio_Kotlin_App ]; then
            cd Android_Studio_Kotlin_App
          fi
          gradle assembleDebug --console=plain

      - name: APKs als Download speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Coaching-APKs
          path: |
            **/build/outputs/apk/debug/*.apk
