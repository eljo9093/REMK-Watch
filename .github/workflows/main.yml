name: RE:MK v25.9 App & Wear OS Watch Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-wear:
    name: Build Android App & Wear OS Watch (v25.9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: In Android-Ordner wechseln und Build starten
        run: |
          cd Android_Studio_Kotlin_App
          chmod +x gradlew
          ./gradlew clean assembleRelease

      - name: Build-Artefakte (Handy APK & Watch APK) hochladen
        uses: actions/upload-artifact@v4
        with:
          name: REMK-v25.9-App-und-Watch-APKs
          path: |
            Android_Studio_Kotlin_App/app/build/outputs/apk/release/*.apk
            Android_Studio_Kotlin_App/wear/build/outputs/apk/release/*.apk
