name: Android & Wear OS APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APKs bauen und Fehlerursache anzeigen
        shell: bash
        run: |
          set -o pipefail
          if [ -f "Android_Studio_Kotlin_App/settings.gradle.kts" ]; then
            cd Android_Studio_Kotlin_App
          fi

          for MOD in app wear; do
            if [ -d "$MOD/src/main/res" ]; then
              mkdir -p "$MOD/src/main/res/mipmap"
              ICON='<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewport
