name: RE:MK v25.9 App & Wear OS Watch Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-wear:
    name: Build Android App & Wear OS Watch (v25.9)
    runs-on: ubuntu-latest

    steps:
      - name: Code aus Repository auschecken
        uses: actions/checkout@v4

      - name: Java JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Gradle Wrapper automatisch finden und Build starten
        run: |
          # Suche im gesamten Repository nach der gradlew-Datei
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ Fehler: 'gradlew' wurde im Repository nirgendwo gefunden!"
            echo "Bitte stelle sicher, dass der Android-Ordner mitsamt gradlew in das Repository hochgeladen wurde."
            exit 1
          fi
          
          # In den Ordner wechseln, in dem gradlew liegt
          TARGET_DIR=$(dirname "$GRADLEW_PATH")
          echo "📁 Gradle-Verzeichnis gefunden unter: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          chmod +x gradlew
          ./gradlew clean assembleRelease

      - name: Build-Artefakte (Handy APK & Watch APK) sichern
        uses: actions/upload-artifact@v4
        with:
          name: REMK-v25.9-Build-Artifacts
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/aab/release/*.aab
